<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amon Panel - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Poppins', sans-serif; color: #fff; }
        .navbar {
            background: #000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff88;
        }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #00ff88, #00cc66); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px; }
        .server-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #00ff8844;
            margin-bottom: 20px;
        }
        .server-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
            background: #00ff8820;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .iframe-container {
            margin-top: 30px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #00ff8844;
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
        .back-btn {
            background: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo"><i class="fas fa-gamepad"></i> AMON PANEL</div>
        <button class="back-btn" onclick="window.location.href='/user.html'">← Back to Dashboard</button>
    </div>
    
    <div class="container">
        <div class="server-card">
            <div class="server-status"><i class="fas fa-circle"></i> CONNECTED</div>
            <h3><i class="fas fa-server"></i> Your Game Server</h3>
            <p>Panel access loaded below using your credentials.</p>
        </div>
        
        <div class="iframe-container">
            <iframe id="panelIframe" src="about:blank" title="Panel Control"></iframe>
        </div>
    </div>
    
    <script>
        // Get the stored panel API URL
        const panelApiUrl = localStorage.getItem('panelApiUrl');
        const panelUsername = localStorage.getItem('panelUsername');
        
        if (panelApiUrl) {
            // Load the real panel in iframe (URL is hidden from user)
            document.getElementById('panelIframe').src = panelApiUrl;
        } else {
            document.getElementById('panelIframe').src = 'https://panel.spaceify.eu';
        }
    </script>
</body>
</html>
