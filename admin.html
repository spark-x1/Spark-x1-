<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmonTech1 | Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Poppins', sans-serif; color: #fff; }
        .navbar { background: #000; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff88; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #00ff88, #00cc66); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a2e; border-radius: 20px; padding: 25px; text-align: center; border: 1px solid #00ff8844; }
        .stat-card i { font-size: 40px; color: #00ff88; }
        .stat-card h3 { font-size: 32px; color: #00ff88; }
        .section-title { font-size: 22px; margin: 30px 0 20px; border-left: 4px solid #00ff88; padding-left: 15px; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { background: #222; border: none; padding: 10px 25px; border-radius: 50px; color: #fff; cursor: pointer; }
        .tab-btn.active { background: #00ff88; color: #000; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: #111; border-radius: 20px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #00ff88; }
        .add-coins-btn, .delete-btn { padding: 5px 15px; border-radius: 20px; border: none; cursor: pointer; margin: 2px; }
        .add-coins-btn { background: #00ff8820; color: #00ff88; border: 1px solid #00ff88; }
        .delete-btn { background: #ff444420; color: #ff8888; border: 1px solid #ff4444; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #00ff8844; border-radius: 50px; color: #fff; }
        .btn { background: linear-gradient(135deg, #00ff88, #00cc66); border: none; padding: 12px; border-radius: 50px; color: #000; font-weight: bold; cursor: pointer; width: 100%; }
        .success-msg { background: #00ff8820; border: 1px solid #00ff88; border-radius: 10px; padding: 10px; margin-bottom: 15px; color: #00ff88; text-align: center; }
        .error-msg { background: #ff444420; border: 1px solid #ff4444; border-radius: 10px; padding: 10px; margin-bottom: 15px; color: #ff8888; text-align: center; }
        .logout-btn { background: rgba(255,0,0,0.2); border: 1px solid #ff4444; padding: 8px 20px; border-radius: 50px; color: #ff8888; cursor: pointer; }
        @media (max-width: 768px) { th, td { font-size: 12px; padding: 8px; } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">AMONTECH1 | ADMIN</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><i class="fas fa-users"></i><h3 id="totalUsers">0</h3><p>Users</p></div>
            <div class="stat-card"><i class="fas fa-coins"></i><h3 id="totalCoins">0</h3><p>Coins</p></div>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showTab('users')">Users</button>
            <button class="tab-btn" onclick="showTab('panels')">Panels</button>
            <button class="tab-btn" onclick="showTab('create')">Create Panel</button>
            <button class="tab-btn" onclick="showTab('addCoins')">Add Coins</button>
        </div>
        
        <div id="usersTab" class="tab-content active">
            <div class="section-title">All Users</div>
            <table style="width:100%"><thead><tr><th>ID</th><th>Username</th><th>Phone</th><th>💰 Coins</th><th>Role</th><th>Action</th></tr></thead><tbody id="usersList"></tbody></table>
        </div>
        
        <div id="panelsTab" class="tab-content">
            <div class="section-title">Panel Credentials</div>
            <table style="width:100%"><thead><tr><th>ID</th><th>Username</th><th>Plan</th><th>Owner</th><th>Action</th></tr></thead><tbody id="panelsList"></tbody></table>
        </div>
        
        <div id="createTab" class="tab-content">
            <div class="section-title">Create Panel</div>
            <div style="max-width: 450px;">
                <div id="createMsg"></div>
                <input type="text" id="panelUser" class="input-field" placeholder="Panel Username">
                <input type="password" id="panelPass" class="input-field" placeholder="Panel Password">
                <select id="panelPlan" class="input-field"><option>Starter</option><option>Pro</option><option>Unlimited</option></select>
                <input type="number" id="panelUserId" class="input-field" placeholder="User ID">
                <button class="btn" onclick="createPanel()">Create Panel</button>
            </div>
        </div>
        
        <div id="addCoinsTab" class="tab-content">
            <div class="section-title">Add Coins</div>
            <div style="max-width: 450px;">
                <div id="addCoinsMsg"></div>
                <input type="number" id="coinUserId" class="input-field" placeholder="User ID">
                <input type="number" id="coinAmount" class="input-field" placeholder="Amount">
                <button class="btn" onclick="addCoins()">Add Coins</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('authToken');
        if (!token) window.location.href = '/';
        
        async function loadStats() {
            const res = await fetch(`${API_URL}/api/admin/stats`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('totalUsers').innerText = data.totalUsers || 0;
            document.getElementById('totalCoins').innerText = data.totalCoinsInCirculation || 0;
        }
        
        async function loadUsers() {
            const res = await fetch(`${API_URL}/api/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('usersList').innerHTML = (data.users || []).map(u => `
                <tr><td>${u.id}</td><td>${u.username}</td><td>${u.phone || '-'}</td><td style="color:#00ff88;font-weight:bold">${u.balance}</td><td>${u.role}</td>
                <td><button class="add-coins-btn" onclick="openAddCoins(${u.id})">+ Coins</button></td></tr>
            `).join('');
        }
        
        async function loadPanels() {
            const res = await fetch(`${API_URL}/api/admin/panels`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('panelsList').innerHTML = (data.panels || []).map(p => `
                <tr><td>${p.id}</td><td>${p.username}</td><td>${p.plan}</td><td>${p.owner_name || '-'}</td>
                <td><button class="delete-btn" onclick="deletePanel(${p.id})">Delete</button></td></tr>
            `).join('');
        }
        
        async function createPanel() {
            const username = document.getElementById('panelUser').value;
            const password = document.getElementById('panelPass').value;
            const plan = document.getElementById('panelPlan').value;
            const userId = document.getElementById('panelUserId').value;
            const msg = document.getElementById('createMsg');
            if (!username || !password) { msg.innerHTML = '<div class="error-msg">Fill all fields</div>'; setTimeout(()=>msg.innerHTML='',3000); return; }
            
            const res = await fetch(`${API_URL}/api/admin/create-panel`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ panelUsername: username, panelPassword: password, plan, userId: userId || null })
            });
            const data = await res.json();
            if (data.success) {
                msg.innerHTML = `<div class="success-msg">✅ Panel: ${username} / ${password}</div>`;
                document.getElementById('panelUser').value = ''; document.getElementById('panelPass').value = '';
                loadPanels();
            } else { msg.innerHTML = `<div class="error-msg">❌ ${data.error}</div>`; }
            setTimeout(()=>msg.innerHTML='',5000);
        }
        
        async function addCoins() {
            const userId = document.getElementById('coinUserId').value;
            const amount = document.getElementById('coinAmount').value;
            const msg = document.getElementById('addCoinsMsg');
            if (!userId || !amount) { msg.innerHTML = '<div class="error-msg">Enter User ID and Amount</div>'; setTimeout(()=>msg.innerHTML='',3000); return; }
            
            const res = await fetch(`${API_URL}/api/admin/add-coins`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ userId: parseInt(userId), amount: parseInt(amount) })
            });
            const data = await res.json();
            if (data.success) {
                msg.innerHTML = `<div class="success-msg">✅ ${data.message}</div>`;
                document.getElementById('coinUserId').value = ''; document.getElementById('coinAmount').value = '';
                loadUsers(); loadStats();
            } else { msg.innerHTML = `<div class="error-msg">❌ ${data.error}</div>`; }
            setTimeout(()=>msg.innerHTML='',5000);
        }
        
        function openAddCoins(userId) { document.getElementById('coinUserId').value = userId; showTab('addCoins'); }
        
        async function deletePanel(id) {
            if (!confirm('Delete?')) return;
            await fetch(`${API_URL}/api/admin/panels/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadPanels();
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`${tabName}Tab`).classList.add('active');
            event.target.classList.add('active');
            if (tabName === 'users') loadUsers();
            if (tabName === 'panels') loadPanels();
        }
        
        function logout() { localStorage.removeItem('authToken'); window.location.href = '/'; }
        
        loadStats(); loadUsers(); loadPanels();
    </script>
</body>
</html>
