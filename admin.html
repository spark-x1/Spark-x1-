<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmonTech1 | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Poppins', sans-serif; color: #fff; }
        .navbar { background: #000; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff88; flex-wrap: wrap; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #00ff88, #00cc66); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-buttons { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .nav-link, .logout-btn { background: rgba(255,255,255,0.1); border: 1px solid #00ff8844; padding: 8px 18px; border-radius: 50px; color: #00ff88; text-decoration: none; cursor: pointer; }
        .logout-btn { border-color: #ff4444; color: #ff8888; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a2e; border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #00ff8844; }
        .stat-card i { font-size: 35px; color: #00ff88; }
        .stat-card h3 { font-size: 28px; color: #00ff88; }
        .section-title { font-size: 22px; margin: 30px 0 20px; border-left: 4px solid #00ff88; padding-left: 15px; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { background: #222; border: none; padding: 10px 20px; border-radius: 50px; color: #fff; cursor: pointer; }
        .tab-btn.active { background: #00ff88; color: #000; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: #111; border-radius: 20px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #00ff88; }
        .delete-btn, .add-coins-btn { padding: 5px 12px; border-radius: 20px; border: none; cursor: pointer; margin: 2px; }
        .delete-btn { background: #ff444420; color: #ff8888; border: 1px solid #ff4444; }
        .add-coins-btn { background: #00ff8820; color: #00ff88; border: 1px solid #00ff88; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #00ff8844; border-radius: 50px; color: #fff; }
        .btn { background: linear-gradient(135deg, #00ff88, #00cc66); border: none; padding: 12px; border-radius: 50px; color: #000; font-weight: bold; cursor: pointer; width: 100%; }
        .success-msg { background: #00ff8820; border: 1px solid #00ff88; border-radius: 10px; padding: 10px; margin-bottom: 15px; color: #00ff88; text-align: center; }
        .error-msg { background: #ff444420; border: 1px solid #ff4444; border-radius: 10px; padding: 10px; margin-bottom: 15px; color: #ff8888; text-align: center; }
        @media (max-width: 768px) { .navbar { flex-direction: column; } .container { padding: 20px; } th, td { font-size: 12px; padding: 8px; } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo"><i class="fas fa-bolt"></i> AMONTECH1 | ADMIN</div>
        <div class="nav-buttons">
            <a href="https://github.com/AmonTech1" target="_blank" class="nav-link"><i class="fab fa-github"></i> GitHub</a>
            <span id="adminName" style="color:#00ff88;"><i class="fas fa-user-shield"></i> Admin</span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="container">
        <div class="stats-grid" id="statsContainer">
            <div class="stat-card"><i class="fas fa-users"></i><h3 id="totalUsers">0</h3><p>Users</p></div>
            <div class="stat-card"><i class="fas fa-server"></i><h3 id="totalPanels">0</h3><p>Panels</p></div>
            <div class="stat-card"><i class="fas fa-coins"></i><h3 id="totalCoins">0</h3><p>Coins</p></div>
            <div class="stat-card"><i class="fas fa-chart-line"></i><h3 id="totalRevenue">0</h3><p>Revenue</p></div>
        </div>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showTab('users')"><i class="fas fa-users"></i> Users</button>
            <button class="tab-btn" onclick="showTab('panels')"><i class="fas fa-key"></i> Panels</button>
            <button class="tab-btn" onclick="showTab('create')"><i class="fas fa-plus"></i> Create Panel</button>
            <button class="tab-btn" onclick="showTab('addCoins')"><i class="fas fa-coins"></i> Add Coins</button>
            <button class="tab-btn" onclick="showTab('orders')"><i class="fas fa-shopping-cart"></i> Orders</button>
        </div>
        
        <div id="usersTab" class="tab-content active">
            <div class="section-title">All Users</div>
            <div class="table-container"><table><thead><tr><th>ID</th><th>Username</th><th>Name</th><th>Phone</th><th>Coins</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="usersList"></tbody></table></div>
        </div>
        
        <div id="panelsTab" class="tab-content">
            <div class="section-title">Panel Credentials</div>
            <div class="table-container"><table><thead><tr><th>ID</th><th>Username</th><th>Plan</th><th>Owner</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="panelsList"></tbody></table></div>
        </div>
        
        <div id="createTab" class="tab-content">
            <div class="section-title">Create Panel Credentials</div>
            <div style="max-width: 450px; margin: 0 auto;">
                <div id="createMsg"></div>
                <input type="text" id="panelUser" class="input-field" placeholder="Panel Username">
                <input type="password" id="panelPass" class="input-field" placeholder="Panel Password">
                <select id="panelPlan" class="input-field"><option>Starter (40)</option><option>Pro (120)</option><option>Unlimited (150)</option><option>Admin (300)</option></select>
                <input type="number" id="panelUserId" class="input-field" placeholder="User ID (optional)">
                <button class="btn" onclick="createPanel()">Create Panel</button>
            </div>
        </div>
        
        <div id="addCoinsTab" class="tab-content">
            <div class="section-title">Add Coins to User</div>
            <div style="max-width: 450px; margin: 0 auto;">
                <div id="addCoinsMsg"></div>
                <input type="number" id="coinUserId" class="input-field" placeholder="User ID">
                <input type="number" id="coinAmount" class="input-field" placeholder="Amount (Coins)">
                <button class="btn" onclick="addCoins()">Add Coins</button>
                <p style="margin-top: 15px; color: #aaa; text-align: center;"><i class="fab fa-whatsapp"></i> WhatsApp: 254759006509</p>
            </div>
        </div>
        
        <div id="ordersTab" class="tab-content">
            <div class="section-title">Orders</div>
            <div class="table-container"><table><thead><tr><th>ID</th><th>Order #</th><th>User</th><th>Item</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="ordersList"></tbody></table></div>
        </div>
    </div>
    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('authToken');
        if (!token) window.location.href = '/';
        
        async function loadStats() {
            const res = await fetch(`${API_URL}/api/admin/stats`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('totalUsers').innerText = data.totalUsers || 0;
            document.getElementById('totalPanels').innerText = data.totalPanels || 0;
            document.getElementById('totalCoins').innerText = data.totalCoinsInCirculation || 0;
            document.getElementById('totalRevenue').innerText = data.totalRevenue || 0;
        }
        
        async function loadUsers() {
            const res = await fetch(`${API_URL}/api/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('usersList').innerHTML = (data.users || []).map(u => `
                <tr><td>${u.id}</td><td>${u.username}</td><td>${u.name || '-'}</td><td>${u.phone || '-'}</td><td style="color:#00ff88">${u.balance}</td><td>${u.role}</td><td>${new Date(u.created_at).toLocaleDateString()}</td>
                <td><button class="add-coins-btn" onclick="openAddCoins(${u.id})">+ Coins</button></td></tr>
            `).join('');
        }
        
        async function loadPanels() {
            const res = await fetch(`${API_URL}/api/admin/panels`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('panelsList').innerHTML = (data.panels || []).map(p => `
                <tr><td>${p.id}</td><td><strong>${p.username}</strong><br><small>pass: ••••••</small></td><td>${p.plan}</td><td>${p.owner_name || 'Unassigned'}</td><td style="color:#00ff88">${p.status}</td><td>${new Date(p.created_at).toLocaleDateString()}</td>
                <td><button class="delete-btn" onclick="deletePanel(${p.id})">Delete</button></td></tr>
            `).join('');
        }
        
        async function loadOrders() {
            const res = await fetch(`${API_URL}/api/admin/orders`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('ordersList').innerHTML = (data.orders || []).map(o => `
                <tr><td>${o.id}</td><td><code>${o.order_number}</code></td><td>${o.user_name || o.user_id}</td><td>${o.item_name || o.item_type}</td><td style="color:#00ff88">${o.amount}</td>
                <td><span style="background:${o.payment_status === 'completed' ? '#00ff8820' : '#ff444420'}; padding:4px 10px; border-radius:20px;">${o.payment_status}</span></td>
                <td>${new Date(o.created_at).toLocaleString()}</td></tr>
            `).join('');
        }
        
        async function createPanel() {
            const username = document.getElementById('panelUser').value;
            const password = document.getElementById('panelPass').value;
            const plan = document.getElementById('panelPlan').value;
            const userId = document.getElementById('panelUserId').value;
            const msgDiv = document.getElementById('createMsg');
            if (!username || !password) { msgDiv.innerHTML = '<div class="error-msg">Fill all fields</div>'; setTimeout(()=>msgDiv.innerHTML='',3000); return; }
            try {
                const res = await fetch(`${API_URL}/api/admin/create-panel`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ panelUsername: username, panelPassword: password, plan, userId: userId || null })
                });
                const data = await res.json();
                if (data.success) {
                    msgDiv.innerHTML = `<div class="success-msg">✅ Panel: ${username} / ${password}</div>`;
                    document.getElementById('panelUser').value = ''; document.getElementById('panelPass').value = ''; document.getElementById('panelUserId').value = '';
                    loadPanels(); loadStats();
                } else { msgDiv.innerHTML = `<div class="error-msg">❌ ${data.error}</div>`; }
                setTimeout(()=>msgDiv.innerHTML='',5000);
            } catch(e) { msgDiv.innerHTML = `<div class="error-msg">❌ Error</div>`; }
        }
        
        async function addCoins() {
            const userId = document.getElementById('coinUserId').value;
            const amount = document.getElementById('coinAmount').value;
            const msgDiv = document.getElementById('addCoinsMsg');
            if (!userId || !amount || amount <= 0) { msgDiv.innerHTML = '<div class="error-msg">Valid User ID and Amount</div>'; setTimeout(()=>msgDiv.innerHTML='',3000); return; }
            try {
                const res = await fetch(`${API_URL}/api/admin/add-coins`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ userId: parseInt(userId), amount: parseInt(amount) })
                });
                const data = await res.json();
                if (data.success) {
                    msgDiv.innerHTML = `<div class="success-msg">✅ ${data.message}</div>`;
                    document.getElementById('coinUserId').value = ''; document.getElementById('coinAmount').value = '';
                    loadUsers(); loadStats();
                } else { msgDiv.innerHTML = `<div class="error-msg">❌ ${data.error}</div>`; }
                setTimeout(()=>msgDiv.innerHTML='',5000);
            } catch(e) { msgDiv.innerHTML = `<div class="error-msg">❌ Error</div>`; }
        }
        
        function openAddCoins(userId) { document.getElementById('coinUserId').value = userId; document.getElementById('coinAmount').focus(); showTab('addCoins'); }
        
        async function deletePanel(id) {
            if (!confirm('Delete this panel?')) return;
            await fetch(`${API_URL}/api/admin/panels/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadPanels(); loadStats();
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`${tabName}Tab`).classList.add('active');
            event.target.classList.add('active');
            if (tabName === 'users') loadUsers();
            if (tabName === 'panels') loadPanels();
            if (tabName === 'orders') loadOrders();
        }
        
        function logout() { localStorage.removeItem('authToken'); window.location.href = '/'; }
        
        loadStats(); loadUsers(); loadPanels(); loadOrders();
    </script>
</body>
</html>
