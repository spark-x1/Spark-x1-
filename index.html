<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AmonTech1 | NOVA MD · Benzo MD · Game Panels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Poppins', 'Inter', sans-serif;
            min-height: 100vh;
            color: #fff;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-content {
            text-align: center;
        }

        .loading-logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: pulse 1.5s infinite;
        }

        .loading-logo i {
            font-size: 55px;
            color: #000;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px #00ff88; }
            50% { transform: scale(1.05); box-shadow: 0 0 40px #00ff88; }
        }

        .loading-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .dot-spinner {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { transform: translateY(0); opacity: 0.3; }
            100% { transform: translateY(-15px); opacity: 1; }
        }

        /* Main Container */
        .container {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* Auth Forms */
        .auth-container {
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo-center {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .logo-icon i {
            font-size: 40px;
            color: #000;
        }

        .logo-center h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 50px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border: none;
            border-radius: 50px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .switch-link a {
            color: #00ff88;
            text-decoration: none;
            cursor: pointer;
        }

        .error-msg {
            background: rgba(255,0,0,0.2);
            border: 1px solid #ff4444;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            color: #ff8888;
            font-size: 14px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
        <div class="loading-logo">
            <i class="fas fa-bolt"></i>
        </div>
        <div class="loading-text">AMONTECH1</div>
        <div class="dot-spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <p style="margin-top: 20px; color: #00ff88;">Initializing Secure System...</p>
    </div>
</div>

<!-- Main Container -->
<div id="mainContainer" class="container">
    <!-- Login Form -->
    <div id="loginForm" class="auth-container">
        <div class="logo-center">
            <div class="logo-icon">
                <i class="fas fa-bolt"></i>
            </div>
            <h1>AMONTECH1</h1>
            <p style="color: #aaa; margin-top: 10px;">NOVA MD · Benzo MD · Game Panels</p>
        </div>
        
        <div id="loginError" class="error-msg hidden"></div>
        
        <div class="input-group">
            <label><i class="fas fa-user"></i> Username or Email</label>
            <input type="text" id="loginUsername" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password">
        </div>
        <button class="btn" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login</button>
        
        <div class="switch-link">
            Don't have an account? <a onclick="showRegister()">Register Now</a>
        </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="auth-container hidden">
        <div class="logo-center">
            <div class="logo-icon">
                <i class="fas fa-bolt"></i>
            </div>
            <h1>Create Account</h1>
        </div>
        
        <div id="registerError" class="error-msg hidden"></div>
        
        <div class="input-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input type="text" id="regUsername" placeholder="Choose username">
        </div>
        <div class="input-group">
            <label><i class="fas fa-user-circle"></i> Full Name</label>
            <input type="text" id="regName" placeholder="Your full name">
        </div>
        <div class="input-group">
            <label><i class="fas fa-phone"></i> Phone Number</label>
            <input type="tel" id="regPhone" placeholder="2547xxxxxxxx">
        </div>
        <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="regPassword" placeholder="Create password">
        </div>
        <button class="btn" onclick="register()"><i class="fas fa-user-plus"></i> Register</button>
        
        <div class="switch-link">
            Already have an account? <a onclick="showLogin()">Login</a>
        </div>
    </div>
</div>

<script>
    const API_URL = window.location.origin;
    let authToken = null;
    let currentUser = null;

    // Hide loading after 2 seconds
    setTimeout(() => {
        document.getElementById('loadingScreen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
        }, 500);
    }, 2000);

    // Check if already logged in
    const savedToken = localStorage.getItem('authToken');
    const savedUser = localStorage.getItem('currentUser');
    if (savedToken && savedUser) {
        authToken = savedToken;
        currentUser = JSON.parse(savedUser);
        redirectToDashboard();
    }

    function showRegister() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
    }

    function showLogin() {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
    }

    async function login() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');

        if (!username || !password) {
            errorDiv.textContent = 'Please enter username and password';
            errorDiv.classList.remove('hidden');
            return;
        }

        errorDiv.classList.add('hidden');

        try {
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
                authToken = data.token;
                currentUser = data.user;
                localStorage.setItem('authToken', authToken);
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                redirectToDashboard();
            } else {
                errorDiv.textContent = data.error || 'Login failed';
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.classList.remove('hidden');
        }
    }

    async function register() {
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const name = document.getElementById('regName').value;
        const phone = document.getElementById('regPhone').value;
        const errorDiv = document.getElementById('registerError');

        if (!username || !password) {
            errorDiv.textContent = 'Username and password required';
            errorDiv.classList.remove('hidden');
            return;
        }

        errorDiv.classList.add('hidden');

        try {
            const response = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, name, phone })
            });

            const data = await response.json();

            if (data.success) {
                authToken = data.token;
                currentUser = data.user;
                localStorage.setItem('authToken', authToken);
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                redirectToDashboard();
            } else {
                errorDiv.textContent = data.error || 'Registration failed';
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.classList.remove('hidden');
        }
    }

    function redirectToDashboard() {
        if (currentUser?.role === 'admin') {
            window.location.href = '/admin.html';
        } else {
            window.location.href = '/user.html';
        }
    }
</script>
</body>
</html>
