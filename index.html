<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmonTech1 | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0a0a0a, #1a1a2e); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-container { background: rgba(20,20,40,0.95); border-radius: 30px; padding: 40px; width: 400px; max-width: 90%; border: 1px solid #00ff88; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo i { font-size: 50px; color: #00ff88; }
        .logo h1 { background: linear-gradient(135deg, #00ff88, #00cc66); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .input-field { width: 100%; padding: 14px; margin: 10px 0; background: #222; border: 1px solid #00ff8844; border-radius: 50px; color: #fff; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00ff88, #00cc66); border: none; border-radius: 50px; color: #000; font-weight: bold; cursor: pointer; }
        .switch-link { text-align: center; margin-top: 20px; color: #aaa; cursor: pointer; }
        .switch-link a { color: #00ff88; }
        .hidden { display: none; }
        .error-msg { background: #ff444420; border: 1px solid #ff4444; border-radius: 10px; padding: 10px; margin-bottom: 15px; color: #ff8888; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo"><i class="fas fa-bolt"></i><h1>AMONTECH1</h1></div>
        
        <div id="loginForm">
            <div id="loginError" class="error-msg hidden"></div>
            <input type="text" id="loginUsername" class="input-field" placeholder="Username">
            <input type="password" id="loginPassword" class="input-field" placeholder="Password">
            <button class="btn" onclick="login()">Login</button>
            <div class="switch-link">No account? <a onclick="showRegister()">Register</a></div>
        </div>
        
        <div id="registerForm" class="hidden">
            <div id="registerError" class="error-msg hidden"></div>
            <input type="text" id="regUsername" class="input-field" placeholder="Username">
            <input type="text" id="regName" class="input-field" placeholder="Full Name">
            <input type="tel" id="regPhone" class="input-field" placeholder="Phone">
            <input type="password" id="regPassword" class="input-field" placeholder="Password">
            <button class="btn" onclick="register()">Register</button>
            <div class="switch-link">Have account? <a onclick="showLogin()">Login</a></div>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin;
        let token = localStorage.getItem('authToken');
        if (token) window.location.href = '/user.html';
        
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            if (!username || !password) { errorDiv.textContent = 'Enter username and password'; errorDiv.classList.remove('hidden'); return; }
            errorDiv.classList.add('hidden');
            
            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    if (data.user.role === 'admin') window.location.href = '/admin.html';
                    else window.location.href = '/user.html';
                } else { errorDiv.textContent = data.error; errorDiv.classList.remove('hidden'); }
            } catch(e) { errorDiv.textContent = 'Network error'; errorDiv.classList.remove('hidden'); }
        }
        
        async function register() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const errorDiv = document.getElementById('registerError');
            if (!username || !password) { errorDiv.textContent = 'Username and password required'; errorDiv.classList.remove('hidden'); return; }
            errorDiv.classList.add('hidden');
            
            try {
                const res = await fetch(`${API_URL}/api/register`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, name, phone })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    window.location.href = '/user.html';
                } else { errorDiv.textContent = data.error; errorDiv.classList.remove('hidden'); }
            } catch(e) { errorDiv.textContent = 'Registration failed'; errorDiv.classList.remove('hidden'); }
        }
        
        function showRegister() { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); }
        function showLogin() { document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); }
    </script>
</body>
</html>
